services:
  db:
    image: imresamu/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-farmland_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-farmland} -d ${POSTGRES_DB:-farmland_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
