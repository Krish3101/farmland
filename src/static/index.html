<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmland</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>Farmland</h1>
        <p>Look up and verify farm boundaries</p>
    </header>

    <!-- Search Form -->
    <div class="card">
        <div class="search-area search-area--spaced">
            <input type="password" id="apiKeyInput" placeholder="Enter API Key (X-API-Key)" />
        </div>
        <div class="search-area">
            <input type="text" id="phoneInput" placeholder="Enter Farm Identifier / Phone Number (e.g. 8805508334)" />
            <button class="btn btn-primary" id="fetchBtn">Fetch Farm Data</button>
        </div>
    </div>

    <!-- Error Banner -->
    <div id="errorAlert" class="error-banner hidden"></div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden">
        <div class="results-grid">
            <!-- Left: Raw JSON Response -->
            <div class="card">
                <p class="section-label">Raw GeoJSON Response</p>
                <pre id="rawJson"></pre>
            </div>

            <!-- Right: Interactive Leaflet Map -->
            <div class="card">
                <p class="section-label">Farm Boundary Geometry</p>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js?v=3"></script>
</body>
</html>
