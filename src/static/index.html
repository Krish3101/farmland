<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmland</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --accent: #4f8ef7;
            --accent-hover: #3a78e8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }
        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(90deg, #4f8ef7, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        header p { color: var(--muted); font-size: 0.9rem; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-area {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .search-area input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-area input:focus { border-color: var(--accent); }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .error-banner {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .results-grid { grid-template-columns: 1fr; }
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        #rawJson {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-family: var(--mono);
            font-size: 0.78rem;
            line-height: 1.5;
            color: #a5b4fc;
            overflow: auto;
            max-height: 400px;
            white-space: pre;
        }

        #map {
            height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0d1117;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Farmland</h1>
        <p>Look up and verify farm boundaries</p>
    </header>

    <!-- Search Form -->
    <div class="card">
        <div class="search-area" style="margin-bottom: 14px;">
            <input type="password" id="apiKeyInput" placeholder="Enter API Key (X-API-Key)" />
        </div>
        <div class="search-area">
            <input type="text" id="phoneInput" placeholder="Enter Farm Identifier / Phone Number (e.g. 8805508334)" />
            <button class="btn btn-primary" id="fetchBtn">Fetch Farm Data</button>
        </div>
    </div>

    <!-- Error Banner -->
    <div id="errorAlert" class="error-banner hidden"></div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden">
        <div class="results-grid">
            <!-- Left: Raw JSON Response -->
            <div class="card">
                <p class="section-label">Raw GeoJSON Response</p>
                <pre id="rawJson"></pre>
            </div>

            <!-- Right: Interactive Leaflet Map -->
            <div class="card">
                <p class="section-label">Farm Boundary Geometry</p>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js?v=3"></script>
</body>
</html>
