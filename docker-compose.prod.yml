services:
  db:
    image: imresamu/postgis:15-3.4
    container_name: farmland_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-farmland_db}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-farmland_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: farmland_app
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-farmland_db}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgis_data:
