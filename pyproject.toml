[project]
name = "farmland"
version = "0.1.0"
description = "REST API serving cleaned farmland boundaries as GeoJSON, backed by PostGIS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.16.6",
]
scripts = [
    "pandas>=2.0.0",
    "xlrd>=2.0.1",
    "psycopg2-binary>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["uv.lock"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008: FastAPI evaluates these per request, not once at import.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Test env vars are set before the app is imported.
"tests/conftest.py" = ["E402"]
