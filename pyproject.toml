[project]
name = "farmland"
version = "0.1.0"
description = "REST API serving cleaned farmland boundaries as GeoJSON, backed by PostGIS"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krish Kalya", email = "krishkalya31012005@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["uv.lock"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008: FastAPI evaluates these per request, not once at import.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]
